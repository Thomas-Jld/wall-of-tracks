# /etc/nginx/sites-available/walloftrack; HTTPS is added by `certbot --nginx`.
server {
    server_name walloftrack.thomasjuldo.com;
    access_log /var/log/nginx/walloftrack_access.log;
    error_log /var/log/nginx/walloftrack_error.log;

    root /var/www/walloftrack;
    index index.html;
    gzip on;
    gzip_types application/json;

    # live updates pushed by the tracker (live.py)
    location = /events {
        proxy_pass http://127.0.0.1:8790/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # written by the tracker every few seconds; always revalidate
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    listen 80;
}
