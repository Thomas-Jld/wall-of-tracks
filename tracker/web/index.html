<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wall of Tracks</title>
<style>
  :root { --size: 86vmin; }
  html, body { margin: 0; height: 100%; background: #0c0c0f; overflow: hidden; }
  body { touch-action: manipulation; }  /* a double tap switches style instead of zooming */
  body.idle { cursor: none; }
  /* two layers so a new cover can cross-fade in */
  .backdrop { position: fixed; inset: -10%; background-size: cover; background-position: center;
              filter: blur(70px) brightness(.4) saturate(1.3); opacity: 0; transition: opacity 2.5s ease; }
  .backdrop.on { opacity: 1; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .deck { position: relative; width: var(--size); height: var(--size); border-radius: 50%;
          box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 8px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08); }
  .deck > * { position: absolute; inset: 0; border-radius: 50%; }
  canvas { width: 100%; height: 100%; will-change: transform; }
  /* fine grooves, symmetric so they can sit on a static layer above the spinning art */
  .grooves { pointer-events: none;
    background: repeating-radial-gradient(circle at center, rgba(0,0,0,.22) 0 1px, rgba(255,255,255,.03) 1px 2px, transparent 2px 4px);
    -webkit-mask: radial-gradient(circle, transparent 30.5%, #000 31%, #000 98.4%, transparent 98.6%);
            mask: radial-gradient(circle, transparent 30.5%, #000 31%, #000 98.4%, transparent 98.6%); }
  /* light reflection: stays put while the record turns underneath */
  .sheen { pointer-events: none; mix-blend-mode: screen;
    background: conic-gradient(from 0deg,
      transparent 0deg, rgba(255,255,255,.26) 30deg, transparent 62deg,
      transparent 180deg, rgba(255,255,255,.2) 210deg, transparent 242deg);
    -webkit-mask: radial-gradient(circle, transparent 18%, #000 19%, #000 98.4%, transparent 98.6%);
            mask: radial-gradient(circle, transparent 18%, #000 19%, #000 98.4%, transparent 98.6%); }
  /* hidden menu: hovering (or tapping) the top-right corner reveals it */
  #corner { position: fixed; top: 0; right: 0; width: 110px; height: 110px; z-index: 1; }
  #menu { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; z-index: 2; min-width: 160px;
          display: flex; flex-direction: column; gap: 1px; padding: 6px; border-radius: 12px;
          background: rgba(10,10,14,.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
          box-shadow: 0 10px 30px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.07);
          font: 13px system-ui, sans-serif; opacity: 0; visibility: hidden; transform: translateY(-4px);
          transition: opacity .25s .5s, transform .25s .5s, visibility 0s .75s; }
  #corner:hover + #menu, #menu:hover, #menu:focus-within, #menu.open {
          opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  #menu .head { color: rgba(255,255,255,.4); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 10px 3px; }
  #menu a { color: #e6e6e6; text-decoration: none; padding: 7px 10px; border-radius: 7px; }
  #menu a:hover, #menu a:focus-visible { background: rgba(255,255,255,.12); outline: none; }
  #menu a[aria-current] { color: #fff; font-weight: 600; }
  body.idle #menu:not(:hover):not(:focus-within):not(.open) { cursor: none; }
</style>
<div class="backdrop"></div><div class="backdrop"></div>
<div class="stage">
  <div class="deck" id="deck" role="img" aria-label="The last 24 hours of listening, as a vinyl record">
    <canvas id="disc"></canvas>
    <canvas id="flow" hidden></canvas>
    <div class="grooves"></div>
    <div class="sheen"></div>
  </div>
</div>
<div id="corner" aria-hidden="true"></div>
<nav id="menu" aria-label="Wall of Tracks">
  <a href="/" aria-current="page">Now playing</a>
  <span class="head">Past listening</span>
  <a href="/past/#Eras">Eras</a>
  <a href="/past/#Groove">Groove</a>
  <a href="/past/#Records">Records</a>
  <a href="/past/#Spiral">Top 10 · Spiral</a>
  <a href="/past/#Sleeve">Top 10 · Sleeve</a>
</nav>
<script>
const DAY_MS = 24 * 3600e3;
const RPM = 2.5;               // slow on purpose: it's a wall piece, not a turntable
const STALE_MS = 60e3;         // the tracker reports at least every 10s; silence longer than this means it's down
const canvas = document.getElementById("disc"), deck = document.getElementById("deck");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// nowAt is when *this browser* received the player state, so a skewed clock doesn't matter
let dayPlays = [], nowPlaying = null, nowAt = 0;

// ---------- data: read once on load, then pushed live, with plain polling as a fallback ----------
function setDay(d) {
  dayPlays = d.plays.map(p => ({ ...p, t0: Date.parse(p.t0), t1: Date.parse(p.t1) }));
  dayPlays.forEach(p => image(p.img));  // start downloading covers now, not only once something is drawn
  redraw();
}
function setNow(n) { nowPlaying = n; nowAt = Date.now(); image(n.track?.album_image); redraw(); }

async function poll() {
  try {
    const get = url => fetch(url, { cache: "no-cache" }).then(r => r.ok ? r.json() : Promise.reject(r.status));
    const [d, n] = await Promise.all([get("data/day.json"), get("data/now_playing.json")]);
    setDay(d); setNow(n);
  } catch (e) { console.warn("poll failed", e); }
}

let fallback = null, stream = null, heardAt = 0;
function connect() {
  stream?.close();
  heardAt = Date.now();
  const es = stream = new EventSource("events"), heard = () => { heardAt = Date.now(); };
  es.addEventListener("day", e => { heard(); setDay(JSON.parse(e.data)); });
  es.addEventListener("now", e => { heard(); setNow(JSON.parse(e.data)); });
  es.onopen = () => { heard(); clearInterval(fallback); fallback = null; };
  // EventSource reconnects by itself; poll meanwhile so the page keeps up
  es.onerror = () => { if (!fallback) { poll(); fallback = setInterval(poll, 5000); } };
}
// The tracker sends player state at least every 10s. A stream silent for longer is dead even if the
// browser still thinks it's open, which happens after sleep or a network change: refresh and reconnect.
function checkStream() { if (Date.now() - heardAt > 30e3) { poll(); connect(); } }
setInterval(checkStream, 10e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkStream(); });
addEventListener("online", () => { poll(); connect(); });

function isPlaying() {
  return !!(nowPlaying?.is_playing && Date.now() - nowAt < STALE_MS);
}

// the last 24h of finished plays, plus the track in the player as a growing slice
function composedPlays() {
  const t = Date.now(), cutoff = t - DAY_MS;
  const list = dayPlays.filter(p => p.t1 > cutoff).map(p => ({ ...p, t0: Math.max(p.t0, cutoff) }));
  const tr = nowPlaying?.track;
  if (tr) {
    const at = nowAt, playing = isPlaying();
    const progress = Math.min(tr.duration_ms, (nowPlaying.progress_ms || 0) + (playing ? t - at : 0));
    const t1 = playing ? t : at, last = list[list.length - 1];
    const t0 = Math.max(t1 - progress, last ? last.t1 : cutoff, cutoff);
    if (t1 > t0) list.push({ t0, t1, album: tr.album, img: tr.album_image, track: tr.name, artist: tr.artists[0], live: true });
  }
  return list.map(p => ({ ...p, sec: (p.t1 - p.t0) / 1000 }));
}

// one slice per album, sized by its listening in the last 24h, biggest first
function albumSlices(plays) {
  const byAlbum = new Map();
  for (const p of plays) {
    let s = byAlbum.get(p.album);
    if (!s) byAlbum.set(p.album, s = { album: p.album, img: p.img, sec: 0 });
    s.sec += p.sec;
  }
  return [...byAlbum.values()].sort((a, b) => b.sec - a.sec);
}

function topAlbum(plays) {
  const m = new Map();
  for (const p of plays) if (p.img) m.set(p.album, { sec: (m.get(p.album)?.sec || 0) + p.sec, img: p.img });
  return [...m.values()].sort((a, b) => b.sec - a.sec)[0] || null;
}

// ---------- covers ----------
const images = new Map();
function image(url) {
  if (!url) return null;
  if (!images.has(url)) {
    const img = new Image();
    img.crossOrigin = "anonymous";  // so the flow layer may use the drawn record as a texture
    img.onload = () => redraw();
    img.src = url;
    images.set(url, img);
  }
  const img = images.get(url);
  return img.complete && img.naturalWidth ? img : null;
}

// ---------- background: follows the label, cross-fading once the new cover has loaded ----------
const backdrops = [...document.querySelectorAll(".backdrop")];
let backdropUrl, front = 0;
function setBackdrop(url) {
  if (url === backdropUrl) return;
  backdropUrl = url;
  const show = () => {
    if (backdropUrl !== url) return;  // superseded while loading
    front ^= 1;
    backdrops[front].style.backgroundImage = url ? `url("${url}")` : "none";
    backdrops[front].classList.add("on");
    backdrops[front ^ 1].classList.remove("on");
  };
  if (!url) return show();
  const im = new Image(); im.onload = im.onerror = show; im.src = url;
}

// ---------- style: Organic + flow by default, Classic on a double click; remembered per browser ----------
const SHAPES = {
  classic: { off: () => 0 },
  // every slice edge waves outward; the waves' rhythm, phase and strength drift smoothly around the disc,
  // smooth enough that neighbouring edges stay near-parallel and thin slices never tear
  organic: {
    off: (d, a) => {
      const n = (k1, p1, k2, p2) => 0.5 + 0.3 * Math.sin(k1 * a + p1) + 0.2 * Math.sin(k2 * a + p2);  // periodic, 0..1
      const freq = 2.0 + 1.6 * n(1, 0.3, 3, 2.1), phase = 2 * Math.PI * n(2, 1.7, 1, 4.2), amp = 0.03 + 0.033 * n(3, 0.9, 2, 5.5);
      return amp * (Math.sin(d * Math.PI * freq + phase) + 0.35 * Math.sin(d * Math.PI * 5.3 + 2 * phase)) * Math.min(1, d * 4);
    },
  },
};
let style = "flow";  // "flow" (organic + flow) | "classic"
try { style = localStorage.getItem("wot-style") || "flow"; } catch {}

// ---------- drawing ----------
let redrawQueued = false;
function redraw() {
  if (redrawQueued) return;
  redrawQueued = true;
  requestAnimationFrame(() => { redrawQueued = false; drawDisc(); });
}

function drawDisc() {
  const px = Math.round(deck.clientWidth * (devicePixelRatio || 1));
  if (px < 50) return;
  if (canvas.width !== px) canvas.width = canvas.height = px;
  const ctx = canvas.getContext("2d"), R = px / 2;
  const rOut = R * 0.985, rArt = R * 0.97, rWax = R * 0.31, rLabel = R * 0.3, span = rArt - rWax;
  const groove = Math.max(1, R * 0.006), shape = style === "classic" ? SHAPES.classic : SHAPES.organic;
  ctx.clearRect(0, 0, px, px);
  ctx.fillStyle = "#0a0a0c"; ctx.beginPath(); ctx.arc(R, R, rOut, 0, 7); ctx.fill();

  const plays = composedPlays(), rs = albumSlices(plays), total = rs.reduce((a, r) => a + r.sec, 0);
  let acc = 0;
  for (const run of rs) {
    const a0 = -Math.PI / 2 + 2 * Math.PI * acc / total, a1 = a0 + 2 * Math.PI * run.sec / total;
    acc += run.sec;
    // positions inside a slice: u across it (0..1), d from its inner edge to its outer edge (0..1)
    const angle = (u, d) => { const base = a0 + u * (a1 - a0); return base + shape.off(d, base); };
    const at = (u, d) => { const a = angle(u, d), r = rWax + span * d; return [R + r * Math.cos(a), R + r * Math.sin(a)]; };
    const nU = Math.max(8, Math.ceil((a1 - a0) * 60)), nD = 40;

    ctx.save(); ctx.beginPath();
    for (let i = 0; i <= nU; i++) ctx.lineTo(...at(i / nU, 0));
    for (let i = 0; i <= nD; i++) ctx.lineTo(...at(1, i / nD));
    for (let i = nU; i >= 0; i--) ctx.lineTo(...at(i / nU, 1));
    for (let i = nD; i >= 0; i--) ctx.lineTo(...at(0, i / nD));
    ctx.closePath(); ctx.clip();
    // cover printed with its top facing outward, centred on the slice
    const am = angle(0.5, 0.5), rm = rWax + span / 2, s = Math.max(span, rm * (a1 - a0)) * 1.15, im = image(run.img);
    if (im) { ctx.save(); ctx.translate(R, R); ctx.rotate(am + Math.PI / 2); ctx.drawImage(im, -s / 2, -rm - s / 2, s, s); ctx.restore(); }

    ctx.restore();
    if (rs.length > 1) {
      ctx.beginPath(); for (let i = 0; i <= nD; i++) ctx.lineTo(...at(0, i / nD));
      ctx.strokeStyle = "rgba(6,6,8,.85)"; ctx.lineWidth = groove * 0.6; ctx.stroke();
    }
  }

  // soften the art toward the edges so it sits *in* the vinyl
  const shade = ctx.createRadialGradient(R, R, rWax, R, R, rArt);
  shade.addColorStop(0, "rgba(0,0,0,.35)"); shade.addColorStop(0.12, "rgba(0,0,0,0)");
  shade.addColorStop(0.9, "rgba(0,0,0,0)"); shade.addColorStop(1, "rgba(0,0,0,.45)");
  ctx.fillStyle = shade; ctx.beginPath(); ctx.arc(R, R, rArt, 0, 7); ctx.arc(R, R, rWax, 0, 7, true); ctx.fill();

  // label: what's playing, else the album of the day; then the spindle hole
  const top = topAlbum(plays), playing = isPlaying();
  const labelImg = image(playing ? nowPlaying.track?.album_image : top?.img);
  ctx.save(); ctx.beginPath(); ctx.arc(R, R, rLabel, 0, 7); ctx.clip();
  ctx.fillStyle = "#15151a"; ctx.fillRect(R - rLabel, R - rLabel, rLabel * 2, rLabel * 2);
  if (labelImg) ctx.drawImage(labelImg, R - rLabel, R - rLabel, rLabel * 2, rLabel * 2);
  const lshade = ctx.createRadialGradient(R, R, 0, R, R, rLabel);
  lshade.addColorStop(0.75, "rgba(0,0,0,0)"); lshade.addColorStop(1, "rgba(0,0,0,.35)");
  ctx.fillStyle = lshade; ctx.fillRect(R - rLabel, R - rLabel, rLabel * 2, rLabel * 2);
  ctx.restore();
  ctx.fillStyle = "#0c0c0f"; ctx.beginPath(); ctx.arc(R, R, R * 0.022, 0, 7); ctx.fill();

  if (style === "flow") uploadFlow();
  setBackdrop(playing ? nowPlaying.track?.album_image : top?.img);

  const tr = nowPlaying?.track;
  deck.setAttribute("aria-label", `The last 24 hours of listening as a vinyl record: ${plays.length} tracks.` +
    (playing && tr ? ` Now playing ${tr.name} by ${tr.artists.join(", ")}.` : ""));
}

// ---------- flow: the drawn record, slowly marbled on the GPU ----------
const flowCanvas = document.getElementById("flow");
let gl = null, uTime = null, flowBroken = false;
function setupFlow() {
  gl = flowCanvas.getContext("webgl");
  if (!gl) return false;
  const shader = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, "attribute vec2 p; varying vec2 v; void main() { v = p * .5 + .5; gl_Position = vec4(p, 0, 1); }"));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, `
    precision highp float;
    varying vec2 v; uniform sampler2D tex; uniform float t;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
    float fbm(vec2 p) { float s = 0., a = .5; for (int k = 0; k < 4; k++) { s += a * noise(p); p *= 2.03; a *= .5; } return s; }
    void main() {
      vec2 p = v * 2. - 1.;
      float r = length(p), a = atan(p.y, p.x);
      if (r > 1.) { gl_FragColor = vec4(0.); return; }
      float w = smoothstep(.31, .42, r) * (1. - smoothstep(.93, .975, r));  // the label and the rim stay still
      vec2 q = p * 2. + vec2(t * .02, -t * .015);
      a += w * .14 * (fbm(q) - .5);
      r += w * .012 * (fbm(q * 1.3 + 7.) - .5);
      gl_FragColor = texture2D(tex, vec2(cos(a), sin(a)) * r * .5 + .5);
    }`));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { gl = null; return false; }
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  uTime = gl.getUniformLocation(prog, "t");
  return true;
}
function uploadFlow() {
  if (!gl || flowBroken) return;
  try {
    if (flowCanvas.width !== canvas.width) { flowCanvas.width = flowCanvas.height = canvas.width; gl.viewport(0, 0, canvas.width, canvas.height); }
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
  } catch (e) {  // a cover served without CORS taints the canvas: stay on the plain organic record
    console.warn("flow unavailable", e); flowBroken = true; applyStyle();
  }
}
const flowing = () => style === "flow" && gl && !flowBroken;
function applyStyle() {
  if (style === "flow" && !gl && !flowBroken && !setupFlow()) flowBroken = true;
  flowCanvas.hidden = !flowing(); canvas.hidden = flowing();
  redraw();
}
function toggleStyle() {
  style = style === "classic" ? "flow" : "classic";
  try { localStorage.setItem("wot-style", style); } catch {}
  applyStyle();
}

// ---------- spin: ease up when playing, coast down when paused, like a turntable ----------
// the flow moves with the spin, so the record settles completely when the music stops
let angle = 0, speed = 0, flowTime = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const playing = isPlaying(), full = RPM * 6, target = playing && !reduceMotion ? full : 0;
  speed += (target - speed) * (1 - Math.exp(-dt / (playing ? 0.9 : 2.2)));
  if (speed > 0.001) {
    angle = (angle + speed * dt) % 360; flowTime += dt * speed / full;
    canvas.style.transform = flowCanvas.style.transform = `rotate(${angle}deg)`;
  }
  if (flowing()) { gl.uniform1f(uTime, flowTime); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }
  requestAnimationFrame(frame);
}

// ---------- layout & display niceties ----------
function fit() {
  document.documentElement.style.setProperty("--size", Math.min(innerWidth, innerHeight) * 0.86 + "px");
  redraw();
}
addEventListener("resize", fit);
// touch screens have no hover: tapping the corner opens the menu, the next tap elsewhere closes it,
// and only a tap with the menu closed toggles fullscreen
const menu = document.getElementById("menu");
document.getElementById("corner").addEventListener("click", e => { e.stopPropagation(); menu.classList.add("open"); });
menu.addEventListener("click", e => e.stopPropagation());
// one tap toggles fullscreen, a double tap switches between the organic and classic record;
// a single tap waits a moment so a double tap doesn't also flip fullscreen twice
let tapTimer = null;
addEventListener("click", () => {
  if (menu.classList.contains("open")) { menu.classList.remove("open"); return; }
  if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; toggleStyle(); return; }
  tapTimer = setTimeout(() => {
    tapTimer = null;
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  }, 280);
});
let idleTimer;
addEventListener("pointermove", () => {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
});

fit();
applyStyle();
poll();      // the first picture shouldn't wait for the live stream
connect();
setInterval(() => { if (isPlaying()) redraw(); }, 2000);  // the live slice keeps growing
requestAnimationFrame(frame);
</script>
